name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache root dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-root-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-root-

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install root dependencies
        run: |
          cd ..
          bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting and linting
        run: |
          cd ..
          bunx biome check frontend/

      - name: Run ESLint
        run: bun run lint

      - name: Run tests
        run: bun run test

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clubpoisson
          POSTGRES_PASSWORD: clubpoisson
          POSTGRES_DB: clubpoisson
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: clubpoisson
      PGUSER: clubpoisson
      PGPASSWORD: clubpoisson
      ADMIN_PASSWORD: test-password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache root dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-root-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-root-

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Install root dependencies
        run: |
          cd ..
          bun install --frozen-lockfile

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting and linting
        run: |
          cd ..
          bunx biome check backend/

      - name: Start backend server
        run: |
          cd ..
          bun run backend/src/index.ts &
          sleep 5
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: clubpoisson
          PGUSER: clubpoisson
          PGPASSWORD: clubpoisson
          ADMIN_PASSWORD: test-password

      - name: Run tests
        run: bun test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: clubpoisson
          PGUSER: clubpoisson
          PGPASSWORD: clubpoisson
          ADMIN_PASSWORD: test-password

